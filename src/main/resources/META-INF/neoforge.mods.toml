# 1.21.1（NeoForge 21.1.x）必须显式声明 modLoader / loaderVersion；license 必填。
# 花括号占位符由 build.gradle 的 processResources 在构建时展开（值来自 gradle.properties）。
# 注意：不要在本文件里写“美元号+花括号”形式的示例文字，它会被 Groovy 模板当表达式求值导致构建失败。
modLoader="javafml"
loaderVersion="[1,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description="${mod_description}"

[[dependencies.${mod_id}]]
modId="neoforge"
versionRange="${neo_version_range}"
mandatory=true
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
versionRange="${minecraft_version_range}"
mandatory=true
ordering="NONE"
side="BOTH"

# 前置：Create（机械动力）
[[dependencies.${mod_id}]]
modId="create"
versionRange="${create_version_range}"
mandatory=true
ordering="AFTER"
side="BOTH"

# 前置：Create: Mechanical Spawner（动力刷怪笼）
[[dependencies.${mod_id}]]
modId="create_mechanical_spawner"
versionRange="${mechanical_spawner_version_range}"
mandatory=true
ordering="AFTER"
side="BOTH"

# 传递前置：Mechanicals Lib（动力刷怪笼 1.3.x 自身要求 mechanicals 1.1.4~1.2.0）
[[dependencies.${mod_id}]]
modId="mechanicals"
versionRange="${mechanicals_version_range}"
mandatory=true
ordering="AFTER"
side="BOTH"
