plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    // Create 本体（官方 maven，提供 -all classifier 的完整 jar）
    maven {
        name = 'Create'
        url = 'https://maven.createmod.net'
    }
    // Create: Mechanical Spawner 只在 CurseForge 发布，走 curse.maven 代理
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    // Mechanicals Lib 只在 CurseForge / Modrinth 发布，这里走 Modrinth 的 maven 代理
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    // ---- 前置：Create（机械动力）----
    // 官方 maven 只发裸 jar（已内含 Ponder/Flywheel 等），无 -all classifier；
    // 编译期只要 API，禁止把本体打包进产物。
    compileOnly("com.simibubi.create:create-${minecraft_version}:${create_version}") {
        transitive = false
    }
    // 开发环境（runClient / runServer）需要真实模组 jar
    runtimeOnly("com.simibubi.create:create-${minecraft_version}:${create_version}") {
        transitive = false
    }

    // ---- 前置：Create: Mechanical Spawner（动力刷怪笼）----
    compileOnly("curse.maven:create-mechanical-spawner-${mechanical_spawner_project}:${mechanical_spawner_file}")
    runtimeOnly("curse.maven:create-mechanical-spawner-${mechanical_spawner_project}:${mechanical_spawner_file}")

    // ---- 传递前置：Mechanicals Lib ----
    // 我们不直接调用它的 API，只在开发环境提供真实 jar，否则 runClient 会因缺依赖拒载。
    runtimeOnly("maven.modrinth:mechanicals-lib:${mechanicals_version}")
}

// runData 输出挂进资源源集，随 jar 打包（勿手动改 generated 文件）。
sourceSets.main.resources { srcDir 'src/generated/resources' }

// 只在 neoforge.mods.toml 上做占位符展开，其它资源文件原样复制。
// 注意：expand 底层是 Groovy 模板引擎，会把它看到的任何“美元号+花括号”片段
// 当作表达式求值——资源文件里出现非占位符的该类写法会让构建以模板解析失败报错。
processResources {
    filesMatching('META-INF/neoforge.mods.toml') {
        expand project.properties
    }
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}
