org.gradle.jvmargs=-Xmx3G

# Minecraft / NeoForge（两值必须对应同一 MC 版本）
minecraft_version=1.21.1
neo_version=21.1.249

# 依赖版本区间（neoforge.mods.toml 的 dependencies 用）
minecraft_version_range=[1.21.1,1.22)
neo_version_range=[21.1,)

# 前置模组：Create（机械动力）
create_version=6.0.10-280
create_version_range=[6.0.10,6.1.0)

# 前置模组：Create: Mechanical Spawner（动力刷怪笼）
# curse.maven 坐标 = curse.maven:create-mechanical-spawner-<projectId>:<fileId>
mechanical_spawner_project=821828
mechanical_spawner_file=8418593
mechanical_spawner_version_range=[1.3.0,)

# 传递前置：Mechanicals Lib（动力刷怪笼 1.3.x 要求 mechanicals 1.1.4~1.2.0）
# 「坐标版本」形如 1.21.1-1.1.6，对应模组版本 1.1.6
mechanicals_version=1.21.1-1.1.6
mechanicals_version_range=[1.1.4,1.2.0)

# Mod metadata（mod_id 必须与 @Mod 注解、neoforge.mods.toml 的 modId 一致）
mod_id=create_mechanical_spawner_structures
mod_name=Mechanical Spawner: Structures
mod_version=0.1.0
mod_group_id=io.github.ling.spawnerstructures
mod_authors=Ling
mod_license=MIT
mod_description=An addon for Create: Mechanical Spawner, driven by Create rotational power.
